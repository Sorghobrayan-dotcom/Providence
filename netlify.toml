# The build is a plain static Vite output; the only server-side piece is the
# Scripture proxy, which exists so the App Key never reaches the browser.

[build]
  command = "npm run build"
  publish = "dist"

# index.html is the editor, and it is the product. nuit-du-baton.html is the
# earlier boss-fight prototype, kept because the editor reuses its renderer.
# No redirect: the front door is already at the root.
